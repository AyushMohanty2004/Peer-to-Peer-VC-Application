<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EdGar - Educational Video Call</title>
    <style>
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>EdGar</h1>
            <p>Educational Video Call</p>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <h2>Login</h2>
            <input type="text" name="username" placeholder="Username" required/>
            <input type="password" name="password" placeholder="Password" required/>
            <input type="submit" value="Login"/>
            <p>Don't have an account? <a href="#" id="show-register">Register here</a></p>
            <p class="error hidden" id="login-error"></p>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden">
            <h2>Register</h2>
            <input type="text" name="username" placeholder="Username" required/>
            <input type="password" name="password" placeholder="Password" required/>
            <input type="password" name="confirm-password" placeholder="Confirm Password" required/>
            <input type="submit" value="Register"/>
            <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
            <p class="error hidden" id="register-error"></p>
        </form>

        <!-- Room Join Form -->
        <form id="join-form" class="hidden">
            <h2>Join Room</h2>
            <p class="instructions">Enter a unique room ID to create your room or enter an existing one to join a room</p>
            <input type="text" name="invite_link" placeholder="Enter room ID" required/>
            <input type="submit" value="Join Room"/>
            <button type="button" id="logout-btn">Logout</button>
        </form>
    </div>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const joinForm = document.getElementById('join-form');
        const showRegisterLink = document.getElementById('show-register');
        const showLoginLink = document.getElementById('show-login');
        const logoutBtn = document.getElementById('logout-btn');
        const loginError = document.getElementById('login-error');
        const registerError = document.getElementById('register-error');

        // Check if user is already logged in
        function checkAuth() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                loginForm.classList.add('hidden');
                registerForm.classList.add('hidden');
                joinForm.classList.remove('hidden');
            }
        }

        // Show/Hide forms
        showRegisterLink.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        });

        showLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        });

        // Handle Registration
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = e.target.username.value;
            const password = e.target.password.value;
            const confirmPassword = e.target['confirm-password'].value;

            if (password !== confirmPassword) {
                registerError.textContent = "Passwords don't match";
                registerError.classList.remove('hidden');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '{}');
            
            if (users[username]) {
                registerError.textContent = "Username already exists";
                registerError.classList.remove('hidden');
                return;
            }

            users[username] = password;
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', username);
            
            registerForm.classList.add('hidden');
            joinForm.classList.remove('hidden');
        });

        // Handle Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = e.target.username.value;
            const password = e.target.password.value;

            const users = JSON.parse(localStorage.getItem('users') || '{}');
            
            if (!users[username] || users[username] !== password) {
                loginError.textContent = "Invalid username or password";
                loginError.classList.remove('hidden');
                return;
            }

            localStorage.setItem('currentUser', username);
            loginForm.classList.add('hidden');
            joinForm.classList.remove('hidden');
        });

        // Handle Room Join
        joinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let inviteCode = e.target.invite_link.value;
            window.location = `index.html?room=${inviteCode}`;
        });

        // Handle Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            joinForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        });

        // Check authentication status on page load
        checkAuth();
    </script>
</body>
</html>
