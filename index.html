<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PeerChat</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="videos">
        <video class="video-player" id="User-1" autoplay playsinline></video>
        <video class="video-player" id="User-2" autoplay playsinline></video>
    </div>

    <!-- Join Request Modal -->
    <div id="join-request-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="user-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                        </path>
                    </svg>
                </div>
                <h2 class="modal-title">Join Request</h2>
            </div>
            <div class="modal-content">
                <p><span id="requesting-username" class="username"></span> would like to join the call</p>
            </div>
            <div class="modal-buttons">
                <button id="reject-btn" class="modal-button reject-button">Decline</button>
                <button id="accept-btn" class="modal-button accept-button">Accept</button>
            </div>
        </div>
    </div>

    <!-- Waiting Message -->
    <div id="waiting-message">
        <h3>Waiting for host approval...</h3>
    </div>

    <div id="controls">
        <div class="control-container" id="camera-btn">
            <img src="icons/camera.png" alt="Toggle Camera">
        </div>
        <div class="control-container" id="mic-btn">
            <img src="icons/mic.png" alt="Toggle Microphone">
        </div>
        <a href="lobby.html">
            <div class="control-container" id="leave-btn">
                <img src="icons/phone.png" alt="Leave Call">
            </div>
        </a>
    </div>

    <script src="agora-rtm-sdk-1.5.1.js"></script>
    <script src="main.js"></script>
</body>
</html>
